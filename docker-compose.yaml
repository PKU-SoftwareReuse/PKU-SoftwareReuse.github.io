services:
  jekyll-site:
    image: jekyll-site
    build: .
    restart: unless-stopped
    volumes: [ .:/usr/src/app ]
    ports: [ 4000:4000 ]
    user: 1000:1000
    environment: [ JEKYLL_ENV=docker ]
    command: bundle exec jekyll serve -H 0.0.0.0 -w --config _config.yml,_config_docker.yml --destination /tmp/jekyll-preview
