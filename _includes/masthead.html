{% include base_path %}
<a class="skip-link" href="#main" data-i18n-key="skip">跳到主要内容</a>
<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="{{ base_path }}/" aria-label="软件复用研究组首页" data-i18n-aria-key="brand.home">
      <img src="{{ base_path }}/images/group_logo_trans_big.png" alt="">
      <span>
        <strong>软件复用研究组</strong>
        <small>Software Reuse Research Group</small>
      </span>
    </a>

    <nav id="site-nav" class="site-nav" aria-label="主导航" data-i18n-aria-key="nav.label">
      <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav-links">
        <span class="site-nav__toggle-label" data-i18n-key="nav.menu">菜单</span>
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
      <ul id="site-nav-links" class="site-nav__links">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li class="{% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
            <a href="{{ domain }}{{ link.url }}" data-i18n-zh="{{ link.title | escape }}" data-i18n-en="{{ link.title_en | default: link.title | escape }}">{{ link.title }}</a>
          </li>
        {% endfor %}
        <li class="site-nav__join"><a href="{{ base_path }}/people/#join-us"><span data-i18n-key="nav.join">加入我们</span> <i class="fas fa-arrow-right" aria-hidden="true"></i></a></li>
      </ul>
    </nav>
    <button class="site-language-switcher" type="button" data-language-toggle aria-pressed="false" aria-label="切换到英文">
      <span data-language-label>EN</span>
      <i class="fas fa-globe" aria-hidden="true"></i>
    </button>
  </div>
  <div class="site-scroll-progress" aria-hidden="true"><span></span></div>
</header>
<script type="application/json" id="site-name-translations">
{
  {% for item in site.data.authors %}
    {{ item[1].name | jsonify }}: {{ item[1].name_en | default: item[1].name | jsonify }}{% unless forloop.last %},{% endunless %}
  {% endfor %}
}
</script>
